<!DOCTYPE html>
<html lang="ko">
<title>말빛</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  /* ==========================================================
     말빛 — 개인맞춤형 의사소통 AAC 웹앱 (시연판)
     제안서 10의 1·2단계 범위만 구현. 모든 프로필·표현은 가상 예시.
     원칙: 화면에는 표현 버튼만. 조작 버튼은 최소한으로.
     ========================================================== */
  :root{
    --bg:#f6f5f0; --surface:#ffffff; --ink:#1c2420; --muted:#5c6660;
    --line:#dde1db; --accent:#0f5132; --accent-ink:#ffffff; --accent-soft:#e6efe8;
    --danger:#b3261e; --danger-ink:#ffffff; --danger-soft:#fbeae8;
    --chip:#eef2ec; --focus:#ffb703; --shadow:0 1px 3px rgba(28,36,32,.08);
    --bscale:1; --fscale:1; --cols:2;
    --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --disp:'Gowun Dodum','Noto Sans KR',sans-serif;
  }
  body.hc{
    --bg:#000000; --surface:#141414; --ink:#ffffff; --muted:#d6d6d6;
    --line:#5a5a5a; --accent:#ffd400; --accent-ink:#000000; --accent-soft:#2e2a12;
    --danger:#ff7264; --danger-ink:#000000; --danger-soft:#3a100b;
    --chip:#242424; --focus:#00e0ff; --shadow:none;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{height:100%;}
  body{
    height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:calc(16px * var(--fscale));
    line-height:1.5; word-break:keep-all;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button{
    font-family:inherit; font-size:inherit; color:inherit;
    background:var(--surface); border:2px solid var(--line);
    border-radius:14px; cursor:pointer; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  button:focus-visible{outline:4px solid var(--focus); outline-offset:2px;}
  .scan-hl{outline:5px solid var(--focus) !important; outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition:none !important;}
  }

  /* ---------- 상단바 ---------- */
  #topbar{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:var(--surface); border-bottom:2px solid var(--line);
  }
  #topbar .brand{
    font-family:var(--disp); font-size:calc(20px * var(--fscale));
    color:var(--accent); letter-spacing:.02em; display:flex; align-items:baseline; gap:8px;
  }
  #topbar .demo-tag{
    font-size:calc(11px * var(--fscale)); font-weight:700; color:var(--muted);
    border:1.5px solid var(--line); border-radius:99px; padding:1px 8px;
  }
  #setBtn{
    margin-left:auto; font-weight:700; font-size:calc(14px * var(--fscale));
    padding:7px 14px;
  }

  /* ---------- 탭 한 줄 ---------- */
  #cats{
    flex:0 0 auto; display:flex; gap:8px; padding:10px 14px;
    background:var(--surface); border-bottom:2px solid var(--line);
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  #cats button{
    flex:1 0 auto; font-weight:900; font-size:calc(16px * var(--fscale) * var(--bscale));
    padding:calc(10px*var(--bscale)) calc(16px*var(--bscale)); border-radius:99px;
    white-space:nowrap;
  }
  #cats button[aria-selected="true"]{
    background:var(--accent); border-color:var(--accent); color:var(--accent-ink);
  }

  /* ---------- 방금 말한 문장 ---------- */
  #spoken{
    flex:0 0 auto; display:none; align-items:center; gap:10px;
    margin:10px 14px 0; padding:10px 14px;
    background:var(--accent-soft); border:2px solid var(--accent); border-radius:14px;
  }
  #spoken.show{display:flex;}
  #spoken .sp-t{
    flex:1; font-weight:900; font-size:calc(17px * var(--fscale)); line-height:1.4;
  }
  #spoken button{font-weight:700; font-size:calc(14px * var(--fscale)); padding:8px 12px; white-space:nowrap;}

  /* ---------- 본문 ---------- */
  #main{flex:1 1 auto; overflow-y:auto; padding:14px 14px 20px; -webkit-overflow-scrolling:touch;}
  .view{display:none; max-width:860px; margin:0 auto;}
  .view.active{display:block;}
  .view-desc{color:var(--muted); font-size:calc(14px * var(--fscale)); margin-bottom:12px;}
  .backrow{margin-bottom:14px;}
  .backrow button{font-weight:900; font-size:calc(16px * var(--fscale)); padding:12px 18px;}

  /* 표현 격자 */
  .grid{
    display:grid; grid-template-columns:repeat(var(--cols),1fr);
    gap:calc(12px * var(--bscale));
  }
  .exp{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    min-height:calc(96px * var(--bscale)); padding:calc(14px*var(--bscale)) 8px;
    font-weight:700; font-size:calc(19px * var(--fscale) * var(--bscale));
    line-height:1.35; text-align:center; position:relative; overflow:hidden;
    box-shadow:var(--shadow);
  }
  .exp .ico{font-size:calc(32px * var(--bscale)); line-height:1;}
  .exp.danger{border-color:var(--danger); background:var(--danger-soft);}
  body.noemoji .exp .ico{display:none;}
  /* 누르기 유지(dwell) 진행 표시 */
  .exp.dwelling::after{
    content:""; position:absolute; left:0; bottom:0; height:7px; width:100%;
    background:var(--accent); transform-origin:left;
    transform:scaleX(0); animation:dwfill var(--dwms,800ms) linear forwards;
  }
  @keyframes dwfill{to{transform:scaleX(1);}}

  /* ---------- 문장 만들기 ---------- */
  #bSentence{
    min-height:calc(58px * var(--bscale));
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    background:var(--surface); border:2px solid var(--line); border-radius:14px;
    padding:10px 12px; margin-bottom:10px;
  }
  #bSentence .empty{color:var(--muted); font-size:calc(14px * var(--fscale));}
  .chipword{
    background:var(--chip); border:2px solid var(--line); border-radius:12px;
    padding:calc(7px*var(--bscale)) calc(13px*var(--bscale));
    font-size:calc(18px * var(--fscale) * var(--bscale)); font-weight:700;
  }
  #bCtl{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:10px; margin-bottom:14px;}
  #bCtl button{
    min-height:calc(56px * var(--bscale)); font-weight:900;
    font-size:calc(16px * var(--fscale) * var(--bscale));
  }
  #bSpeak{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .tab{
    font-weight:700; font-size:calc(15px * var(--fscale));
    padding:calc(8px*var(--bscale)) calc(14px*var(--bscale)); border-radius:99px;
  }
  .tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  /* ---------- 하단: 도움 요청 하나만 ---------- */
  #helpbar{
    flex:0 0 auto; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:var(--surface); border-top:2px solid var(--line);
  }
  #helpBtn{
    width:100%; min-height:calc(58px * var(--bscale));
    background:var(--danger); border-color:var(--danger); color:var(--danger-ink);
    font-weight:900; font-size:calc(18px * var(--fscale) * var(--bscale));
  }
  #demoFoot{
    flex:0 0 auto; text-align:center; font-size:calc(11px * var(--fscale));
    color:var(--muted); background:var(--surface); padding:3px 8px 4px;
  }

  /* ---------- 상대방 화면 ---------- */
  #partner{
    display:none; position:fixed; inset:0; z-index:50; background:var(--bg);
    flex-direction:column; padding:20px 18px calc(16px + env(safe-area-inset-bottom));
  }
  #partner.open{display:flex;}
  #partner .p-head{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    color:var(--muted); font-weight:700; font-size:calc(14px * var(--fscale));
  }
  #partner.em .p-head .p-tag{color:var(--danger);}
  #pText{
    flex:1 1 auto; display:flex; align-items:center; justify-content:center;
    text-align:center; font-weight:900; line-height:1.4;
    font-size:clamp(30px, 9vw, 76px); padding:10px;
  }
  #partner.em #pText{color:var(--danger);}
  #pGuide{
    text-align:center; color:var(--muted); font-size:calc(15px * var(--fscale));
    border-top:2px solid var(--line); padding-top:10px; margin-bottom:12px;
  }
  #partner .p-btns{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  #partner .p-btns button{
    min-height:calc(64px * var(--bscale)); font-weight:900;
    font-size:calc(17px * var(--fscale) * var(--bscale));
  }
  #pReplay{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  /* ---------- 확인 모달 ---------- */
  #modal{
    display:none; position:fixed; inset:0; z-index:60;
    background:rgba(10,14,12,.55); align-items:center; justify-content:center; padding:18px;
  }
  #modal.open{display:flex;}
  #modal .m-box{
    background:var(--surface); border:3px solid var(--accent); border-radius:18px;
    width:min(560px,100%); padding:22px 20px; text-align:center;
  }
  #modal.warn .m-box{border-color:var(--danger);}
  #mTitle{font-size:calc(17px * var(--fscale)); font-weight:700; color:var(--muted); margin-bottom:10px;}
  #mText{font-size:calc(26px * var(--fscale)); font-weight:900; line-height:1.45; margin-bottom:18px;}
  #modal .m-btns{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  #modal .m-btns button{min-height:calc(64px*var(--bscale)); font-weight:900; font-size:calc(18px * var(--fscale));}
  #mOk{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  #modal.warn #mOk{background:var(--danger); border-color:var(--danger); color:var(--danger-ink);}

  /* ---------- 설정 ---------- */
  .set-card{
    background:var(--surface); border:2px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .set-card h3{
    font-family:var(--disp); font-size:calc(17px * var(--fscale)); margin-bottom:4px;
    color:var(--accent);
  }
  .set-card .h-desc{color:var(--muted); font-size:calc(13px * var(--fscale)); margin-bottom:12px;}
  .set-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px;}
  .set-row:last-child{margin-bottom:0;}
  .set-row label.rl{flex:0 0 128px; font-weight:700; font-size:calc(14px * var(--fscale));}
  .seg{display:flex; flex-wrap:wrap; gap:6px;}
  .seg button{font-weight:700; font-size:calc(14px * var(--fscale)); padding:8px 14px; border-radius:10px;}
  .seg button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .profcard{
    width:100%; text-align:left; padding:12px 14px; margin-bottom:8px;
    display:flex; align-items:center; gap:12px;
  }
  .profcard .pc-ico{font-size:26px;}
  .profcard .pc-name{font-weight:900; font-size:calc(16px * var(--fscale));}
  .profcard .pc-desc{color:var(--muted); font-size:calc(13px * var(--fscale));}
  .profcard[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft);}
  .profcard .pc-cur{margin-left:auto; font-weight:900; color:var(--accent); font-size:calc(13px * var(--fscale));}
  input[type="text"]{
    font-family:inherit; font-size:calc(15px * var(--fscale)); color:var(--ink);
    background:var(--bg); border:2px solid var(--line); border-radius:10px; padding:10px 12px;
  }
  input[type="text"]:focus-visible{outline:4px solid var(--focus); outline-offset:1px;}
  input[type="range"]{accent-color:var(--accent); min-width:150px;}
  textarea{
    width:100%; min-height:110px; font-family:inherit; color:var(--ink);
    font-size:calc(12px * var(--fscale)); background:var(--bg);
    border:2px solid var(--line); border-radius:10px; padding:10px;
  }
  .mini{font-weight:700; font-size:calc(14px * var(--fscale)); padding:9px 14px;}
  .mini.danger{border-color:var(--danger); color:var(--danger); background:var(--danger-soft);}
  .customrow{
    display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line);
    padding:8px 2px; font-size:calc(15px * var(--fscale));
  }
  .customrow:last-child{border-bottom:none;}
  .customrow .cr-t{flex:1;}
  .lockchips{display:flex; flex-wrap:wrap; gap:6px;}
  .lockchip{
    font-size:calc(13px * var(--fscale)); font-weight:700;
    border:1.5px solid var(--line); border-radius:99px; padding:4px 10px;
    background:var(--chip);
  }

  /* 토스트 */
  #toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); font-weight:700;
    font-size:calc(14px * var(--fscale)); padding:10px 18px; border-radius:99px;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:70;
    max-width:90vw; text-align:center;
  }
  #toast.show{opacity:1;}
</style>

<header id="topbar">
  <div class="brand">말빛 <span class="demo-tag">시연판</span></div>
  <button id="setBtn">⚙️ 설정</button>
</header>

<nav id="cats" aria-label="표현 종류"></nav>

<div id="spoken">
  <span class="sp-t" role="status" aria-live="polite"></span>
  <button id="spShow">👁️ 크게 보기</button>
</div>

<main id="main">
  <!-- 표현판 -->
  <section class="view" data-view="quick">
    <div class="grid kgrid" id="quickGrid"></div>
  </section>

  <!-- 문장 만들기 -->
  <section class="view" data-view="builder">
    <div id="bSentence" aria-label="만드는 중인 문장"></div>
    <div id="bCtl">
      <button id="bSpeak">🔊 말하기</button>
      <button id="bShow">👁️ 크게 보기</button>
      <button id="bClear">🧹 지우기</button>
    </div>
    <div class="tabs" id="bankTabs" role="tablist"></div>
    <div class="grid kgrid" id="bankGrid"></div>
    <p class="view-desc" style="margin-top:12px;">단어를 누르면 문장에 붙고, 문장 속 단어를 누르면 빠집니다.</p>
  </section>

  <!-- 도움 요청 -->
  <section class="view" data-view="help">
    <div class="backrow"><button id="helpBack">← 표현으로 돌아가기</button></div>
    <p class="view-desc">이미 〈도와주세요〉 소리가 나갔습니다. 아래 버튼은 알림음과 함께 항상 최대 음량으로 나갑니다.</p>
    <div class="grid kgrid" id="helpGrid"></div>
  </section>

  <!-- 설정 -->
  <section class="view" data-view="settings">
    <div class="backrow"><button id="setBack">← 표현으로 돌아가기</button></div>
    <p class="view-desc">이용인마다 다르게 저장됩니다. 이 시연판은 제안서 10의 1·2단계 범위만 구현하며, 모든 프로필과 표현은 가상의 예시입니다.</p>
    <div id="settingsBody"></div>
  </section>
</main>

<footer id="helpbar">
  <button id="helpBtn">🆘 도움 요청</button>
</footer>
<div id="demoFoot">시연판 · 모든 프로필과 표현은 가상의 예시입니다 · 개인정보를 입력하지 마세요</div>

<!-- 상대방 화면 -->
<div id="partner" role="dialog" aria-modal="true" aria-label="상대방에게 보여주는 화면">
  <div class="p-head">
    <span class="p-tag">상대방에게 보여주는 화면</span>
    <button id="pClose" class="mini">✕ 닫기</button>
  </div>
  <div id="pText"></div>
  <div id="pGuide"></div>
  <div class="p-btns">
    <button id="pReplay">🔊 다시 듣기</button>
    <button id="pWait">⏳ 잠시 기다려주세요</button>
    <button id="pYes">✅ 맞아요</button>
    <button id="pEdit">✏️ 수정할게요</button>
  </div>
</div>

<!-- 확인 모달 -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="m-box">
    <div id="mTitle">이 문장이 맞습니까?</div>
    <div id="mText"></div>
    <div class="m-btns">
      <button id="mOk">네, 말할게요</button>
      <button id="mCancel">아니요, 취소</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   데이터 — 표현판 (모두 가상 예시)
   ========================================================= */
// 특별한 이유 없이 삭제하거나 숨기지 않는 표현 (표현권 보장)
const LOCKED = [
  '아니요','싫어요','중단하고 싶어요','지금 중단해주세요','도와주세요',
  '제가 직접 선택하겠습니다','혼자 있고 싶어요','잘못 이해하셨어요'
];

const BOARDS = [
  {id:'basic', name:'기본', items:[
    ['예','🙆'],['아니요','🙅'],['좋아요','😊'],['싫어요','😖'],
    ['잘 모르겠어요','🤔'],['다시 말해주세요','🔁']
  ]},
  {id:'life', name:'생활', items:[
    ['물 주세요','💧'],['식사하고 싶어요','🍚'],['화장실 가고 싶어요','🚻'],
    ['쉬고 싶어요','🛋️'],['더워요','🥵'],['추워요','🥶']
  ]},
  {id:'act', name:'활동', items:[
    ['참여하고 싶어요','🙋'],['오늘은 쉬고 싶어요','🙇'],['시작할게요','▶️'],
    ['중단하고 싶어요','✋'],['천천히 해주세요','🐢'],['담당자를 불러주세요','📣']
  ]},
  {id:'mine', name:'내 표현', items:[]} // 프로필의 소개 문장 + 맞춤 표현
];

const HELP_ITEMS = [
  ['도와주세요','🆘'],['아파요','🤕'],['숨이 차요','😮‍💨'],
  ['어지러워요','💫'],['지금 중단해주세요','✋'],['담당자를 불러주세요','📣']
];

const BANK = [
  {id:'who', name:'누가', items:[['저는','🙂'],['우리','👥'],['선생님이','🧑‍🏫']]},
  {id:'when', name:'언제', items:[['지금','⏰'],['오늘','📅'],['이따가','🕒']]},
  {id:'where', name:'어디', items:[
    ['집에','🏠'],['화장실에','🚻'],['헬스장에','🏋️'],['프로그램실에','🎨']
  ]},
  {id:'act', name:'행동', items:[
    ['가고 싶어요','➡️'],['하고 싶어요','✨'],['먹고 싶어요','🍚'],
    ['쉬고 싶어요','🛋️'],['도와주세요','🆘'],['그만하고 싶어요','✋']
  ]},
  {id:'state', name:'마음', items:[
    ['좋아요','😊'],['싫어요','😖'],['아파요','🤕'],['힘들어요','😥']
  ]}
];

/* =========================================================
   기본 프로필 (가상 예시)
   ========================================================= */
function defaultSettings(){
  // 기본값은 '한 번 누르면 바로 말하기'. 확인 단계·자동 크게 보기는 필요한 이용인만 켠다.
  return {cols:2, btnScale:1, fontScale:1, contrast:false, showEmoji:true,
          confirm:false, bigAfter:false, dwellMs:0, scan:false, scanMs:1800, rate:1, volume:1};
}
function defaultProfiles(){

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.profiles) && s.profiles.length) return s;
    }
  }catch(e){ /* 저장소를 못 쓰는 환경에서는 메모리로만 동작 */ }
  return {profiles:defaultProfiles(), cur:'c'};
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function P(){ return state.profiles.find(p=>p.id===state.cur) || state.profiles[0]; }
function S(){ return P().settings; }

/* =========================================================
   음성 출력 (TTS)
   ========================================================= */
const TTS_OK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let koVoice = null;
let curU = null; // 발화 객체가 도중에 회수되어 소리가 끊기는 크롬 문제 방지
function pickVoice(){
  if(!TTS_OK) return null;
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v=>/^ko/i.test(v.lang)) || null;
  return koVoice;
}
if(TTS_OK){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, opts){
  if(!text) return;
  opts = opts || {};
  if(!TTS_OK){ toast('이 기기는 음성 출력을 지원하지 않아 문장을 크게 보여줍니다'); return; }
  const synth = speechSynthesis;
  try{
    // 말하는 중일 때만 끊는다 — 놀고 있는데 cancel()을 부르면
    // 일부 크롬에서 바로 다음 speak()가 조용히 무시된다.
    if(synth.speaking || synth.pending) synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    curU = u;
    u.lang = 'ko-KR';
    const v = koVoice || pickVoice();
    if(v) u.voice = v;
    u.rate = opts.rate !== undefined ? opts.rate : S().rate;
    u.volume = opts.volume !== undefined ? opts.volume : S().volume;
    let started = false;
    u.onstart = ()=>{ started = true; };
    synth.resume(); // 일시정지 상태로 굳어 있으면 풀어 준다
    synth.speak(u);
    // cancel() 직후 발화가 무시되는 크롬 버그 대비: 시작을 못 했으면 한 번 재시도
    setTimeout(()=>{
      if(!started && curU === u){
        try{ synth.cancel(); synth.resume(); synth.speak(u); }catch(e){}
      }
    }, 300);
  }catch(e){}
}

/* 긴급 알림음 — 음성 합성이 없는 기기에서도 소리가 나도록 웹오디오로 직접 울린다 */
let ac = null;
function alarmChime(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ac = ac || new AC();
    if(ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    [[880,0],[1320,.18],[880,.36]].forEach(([f,off])=>{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t+off);
      g.gain.exponentialRampToValueAtTime(.9, t+off+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t+off+.17);
      o.connect(g); g.connect(ac.destination);
      o.start(t+off); o.stop(t+off+.2);
    });
  }catch(e){}
}

/* =========================================================
   공용 UI 도우미
   ========================================================= */
const $ = sel => document.querySelector(sel);
let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function el(tag, cls, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html !== undefined) n.innerHTML = html;
  return n;
}
// 선택형 버튼(표현·단어): 누르기 유지/연속입력 방지/스캔의 대상
function makeSelBtn(cls, html, act){
  const b = el('button', cls, html);
  b.dataset.sel = '1';
  b._act = act;
  return b;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 활성화 경로: 클릭 / 누르기 유지 / 스캔 ---------- */
function guardedAct(btn){
  const now = Date.now();
  if(btn._lastFire && now - btn._lastFire < 600) return; // 같은 버튼 연속입력 방지
  btn._lastFire = now;
  btn._act();
}
document.addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn || !btn._act) return;
  // 누르기 유지 모드에서는 포인터 클릭 대신 dwell 완료로만 실행
  if(S().dwellMs > 0 && e.isTrusted && e.detail > 0) return;
  guardedAct(btn);
});
/* 누르기 유지(dwell) */
let dw = null;
function dwCancel(){
  if(!dw) return;
  clearTimeout(dw.timer);
  dw.btn.classList.remove('dwelling');
  dw = null;
}
document.addEventListener('pointerdown', e=>{
  const btn = e.target.closest('button[data-sel]');
  if(!btn || !btn._act) return;
  const ms = S().dwellMs;
  if(!ms) return;
  dwCancel();
  btn.style.setProperty('--dwms', ms+'ms');
  btn.classList.add('dwelling');
  dw = {btn, timer:setTimeout(()=>{ btn.classList.remove('dwelling'); guardedAct(btn); dw=null; }, ms)};
});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev, dwCancel));
document.addEventListener('pointerout', e=>{
  if(dw && e.target === dw.btn && !dw.btn.contains(e.relatedTarget)) dwCancel();
});

/* ---------- 스캔 입력 ---------- */
const scan = {list:[], i:-1, timer:null};
function scanStop(){
  clearInterval(scan.timer); scan.timer = null;
  document.querySelectorAll('.scan-hl').forEach(n=>n.classList.remove('scan-hl'));
  scan.list = []; scan.i = -1;
}
function scanRoot(){
  if($('#modal').classList.contains('open')) return $('#modal');
  if($('#partner').classList.contains('open')) return $('#partner');
  return null;
}
function scanRefresh(){
  scanStop();
  if(!S().scan) return;
  const root = scanRoot();
  let btns;
  if(root){
    btns = [...root.querySelectorAll('button')];
  }else{
    btns = [...document.querySelectorAll(
      '#main .view.active button, #cats button, #topbar button, #helpbar button, #spoken button')];
  }
  scan.list = btns.filter(b=>b.offsetParent !== null && !b.disabled);
  if(!scan.list.length) return;
  scan.timer = setInterval(scanTick, S().scanMs);
  scanTick();
}
function scanTick(){
  document.querySelectorAll('.scan-hl').forEach(n=>n.classList.remove('scan-hl'));
  if(!scan.list.length) return;
  scan.i = (scan.i + 1) % scan.list.length;
  const b = scan.list[scan.i];
  if(!b.isConnected || b.offsetParent === null){ scanRefresh(); return; }
  b.classList.add('scan-hl');
  b.scrollIntoView({block:'nearest'});
}
document.addEventListener('keydown', e=>{
  if(S().scan && (e.key === ' ' || e.key === 'Enter')){
    const b = scan.list[scan.i];
    if(b){
      e.preventDefault();
      b.classList.remove('scan-hl');
      b.click();
      setTimeout(scanRefresh, 50);
      return;
    }
  }
  // 키보드 방향키: 격자 안에서 이동
  const f = document.activeElement;
  if(f && f.tagName === 'BUTTON' && f.closest('.kgrid') &&
     ['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)){
    const grid = f.closest('.kgrid');
    const btns = [...grid.querySelectorAll('button')];
    const i = btns.indexOf(f);
    const cols = S().cols;
    let j = i;
    if(e.key === 'ArrowRight') j = i + 1;
    if(e.key === 'ArrowLeft')  j = i - 1;
    if(e.key === 'ArrowDown')  j = i + cols;
    if(e.key === 'ArrowUp')    j = i - cols;
    if(j >= 0 && j < btns.length){ e.preventDefault(); btns[j].focus(); }
  }
});

function openModal(text, cb, opts){

  $('#modal').classList.toggle('warn', !!opts.warn);
  modalCb = cb;
  $('#modal').classList.add('open');
  $('#mOk').focus();
  scanRefresh();
}
function closeModal(){
  $('#modal').classList.remove('open'); modalCb = null; scanRefresh();
}
$('#mOk').addEventListener('click', ()=>{ const cb = modalCb; closeModal(); if(cb) cb(); });
$('#mCancel').addEventListener('click', closeModal);

function openPartner(text, emergency){
  $('#pText').textContent = text;
  $('#pGuide').textContent = P().guide || '';
  $('#partner').classList.toggle('em', !!emergency);
  $('#partner').classList.add('open');

}

function renderSpoken(){
  const box = $('#spoken');
  const showable = lastSpoken && (curView === 'quick' || curView === 'builder');
  box.classList.toggle('show', !!showable);
  if(showable) box.querySelector('.sp-t').textContent = '🗨️ ' + lastSpoken;
}
function speakOut(text, emergency){
  lastSpoken = text;
  if(emergency){
    alarmChime();                      // 주의 알림음을 먼저 울리고
    speak(text, {volume:1});           // 음량 설정과 무관하게 항상 최대 음량으로
    try{ if(navigator.vibrate) navigator.vibrate([80,60,80]); }catch(e){}
  }else{
    speak(text);
    try{ if(navigator.vibrate) navigator.vibrate(40); }catch(e){}
  }
  renderSpoken();
  // 음성이 안 되는 기기에서는 항상 큰 화면으로 대신 보여 준다
  if(emergency || S().bigAfter || !TTS_OK) openPartner(text, emergency);
  scanRefresh();
}
// 표현 버튼: 원클릭 — 누르면 바로 출력 (확인 단계는 켠 경우에만)
function selectExpression(text){
  if(S().confirm) openModal(text, ()=>speakOut(text));
  else speakOut(text);
}
// 긴급 표현: 항상 즉시 음성 + 상대방 화면
function selectEmergency(text){
  speakOut(text, true);
}
$('#spShow').addEventListener('click', ()=>{ if(lastSpoken) openPartner(lastSpoken, false); });

/* =========================================================
   화면 전환·렌더링
   ========================================================= */
function go(view){
  curView = view;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.dataset.view === view));
  const inBoard = view === 'quick' || view === 'builder';
  $('#cats').style.display = inBoard ? 'flex' : 'none';
  $('#helpbar').style.display = view === 'help' || view === 'settings' ? 'none' : 'block';
  renderCats();
  if(view === 'quick') renderQuick();
  if(view === 'builder') renderBuilder();
  if(view === 'help') renderHelp();
  if(view === 'settings') renderSettings();
  renderSpoken();
  $('#main').scrollTop = 0;
  scanRefresh();
}
function renderCats(){
  const host = $('#cats'); host.innerHTML = '';
  BOARDS.forEach(b=>{
    const btn = el('button', null, escapeHtml(b.name));
    btn.setAttribute('aria-selected', (curView === 'quick' && curCat === b.id) ? 'true' : 'false');
    btn.addEventListener('click', ()=>{ curCat = b.id; go('quick'); });
    host.appendChild(btn);
  });
  const bb = el('button', null, '🧩 문장');
  bb.setAttribute('aria-selected', curView === 'builder' ? 'true' : 'false');
  bb.addEventListener('click', ()=>go('builder'));
  host.appendChild(bb);
}
function expBtn(text, emoji, act, extraCls){
  return makeSelBtn('exp ' + (extraCls||''),
    `<span class="ico">${emoji||'💬'}</span><span>${escapeHtml(text)}</span>`, act);

function renderQuick(){

function renderHelp(){

  /* 2. 표현 관리 */

  const inE = el('input'); inE.type='text'; inE.placeholder='그림(이모지)'; inE.style.width='110px';
  const addB = el('button','mini','＋ 추가');
  addB.addEventListener('click', ()=>{
    const t = inT.value.trim();
    if(!t){ toast('표현 문장을 입력해 주세요'); return; }
    P().custom.push({t, e:(inE.value.trim() || '💬')});
    save(); renderSettings(); toast('표현을 추가했습니다');
  });
  form.append(inT, inE, addB);
  c2.appendChild(form);
  const list = el('div');
  if(!P().custom.length) list.appendChild(el('div','h-desc','등록된 내 표현이 없습니다.'));
  P().custom.forEach((cx,i)=>{
    const r = el('div','customrow',
      `<span>${cx.e}</span><span class="cr-t">${escapeHtml(cx.t)}</span>`);
    const d = el('button','mini danger','삭제');
    d.addEventListener('click', ()=>{
      openModal(`〈${cx.t}〉 표현을 삭제할까요?`, ()=>{
        P().custom.splice(i,1); save(); renderSettings(); toast('삭제했습니다');
      }, {title:'표현 삭제', ok:'네, 삭제할게요', warn:true});
    });
    r.appendChild(d); list.appendChild(r);
  });
  c2.appendChild(list);
  const lockNote = el('div','h-desc');
  lockNote.style.marginTop = '12px';
  lockNote.textContent = '다음 표현은 표현권 보장을 위해 특별한 이유 없이 삭제하거나 숨기지 않습니다.';
  c2.appendChild(lockNote);
  const lc = el('div','lockchips');
  LOCKED.forEach(t=>lc.appendChild(el('span','lockchip','🔒 ' + escapeHtml(t))));
  c2.appendChild(lc);
  host.appendChild(c2);

  /* 3. 화면 */
  const c3 = el('div','set-card');
  c3.appendChild(el('h3',null,'화면'));
  seg(row(c3,'한 줄의 버튼 수'), [['2개',2],['3개',3]], v=>s.cols===v, v=>{s.cols=v;});
  seg(row(c3,'버튼 크기'), [['보통',1],['크게',1.2],['아주 크게',1.4]], v=>s.btnScale===v, v=>{s.btnScale=v;});
  seg(row(c3,'글자 크기'), [['보통',1],['크게',1.15],['아주 크게',1.3]], v=>s.fontScale===v, v=>{s.fontScale=v;});
  seg(row(c3,'고대비 화면'), [['끔',false],['켬',true]], v=>s.contrast===v, v=>{s.contrast=v;});
  seg(row(c3,'그림(이모지) 표시'), [['글자만',false],['그림+글자',true]], v=>s.showEmoji===v, v=>{s.showEmoji=v;});
  host.appendChild(c3);

  /* 4. 입력·확인 */
  const c4 = el('div','set-card');
  c4.appendChild(el('h3',null,'입력과 확인'));
  c4.appendChild(el('div','h-desc','오선택을 예방합니다. 모든 확인을 강제하면 느려질 수 있어 이용인별로 조정합니다.'));
  seg(row(c4,'선택 후 확인'), [['끔 (한 번에 말하기)',false],['켬',true]], v=>s.confirm===v, v=>{s.confirm=v;});
  seg(row(c4,'말한 뒤 크게 보기'), [['끔',false],['켬 (자동으로 상대방 화면)',true]], v=>s.bigAfter===v, v=>{s.bigAfter=v;});
  seg(row(c4,'누르기 유지시간'), [['없음',0],['0.4초',400],['0.6초',600],['1초',1000]], v=>s.dwellMs===v, v=>{s.dwellMs=v;});
  seg(row(c4,'스캔 방식'), [['끔',false],['켬',true]], v=>s.scan===v, v=>{s.scan=v;});
  seg(row(c4,'스캔 속도'), [['느리게',2400],['보통',1800],['빠르게',1200]], v=>s.scanMs===v, v=>{s.scanMs=v;});
  const scanNote = el('div','h-desc');
  scanNote.style.marginTop='6px';
  scanNote.textContent = '스캔 방식: 항목이 차례로 강조되며, 원하는 순간 스페이스 키나 엔터 키를 누르면 선택됩니다. (시선입력기·외부 스위치 연동은 시연판 범위 밖 — 키보드로 원리만 시연)';
  c4.appendChild(scanNote);
  host.appendChild(c4);

  /* 5. 음성 */
  const c5 = el('div','set-card');
  c5.appendChild(el('h3',null,'음성'));
  const r5a = row(c5,'말 빠르기');
  const rate = el('input'); rate.type='range'; rate.min='0.5'; rate.max='1.4'; rate.step='0.05'; rate.value=s.rate;
  const rateV = el('span',null, s.rate.toFixed(2));
  rate.addEventListener('input', ()=>{ s.rate = parseFloat(rate.value); rateV.textContent = s.rate.toFixed(2); save(); });
  r5a.append(rate, rateV);
  const r5b = row(c5,'음량');
  const vol = el('input'); vol.type='range'; vol.min='0.2'; vol.max='1'; vol.step='0.05'; vol.value=s.volume;
  const volV = el('span',null, Math.round(s.volume*100)+'%');
  vol.addEventListener('input', ()=>{ s.volume = parseFloat(vol.value); volV.textContent = Math.round(s.volume*100)+'%'; save(); });
  r5b.append(vol, volV);
  const prev = el('button','mini','🔊 미리 듣기');
  prev.addEventListener('click', ()=>speak('안녕하세요. 지금 목소리는 이렇게 들립니다.'));
  row(c5,'확인').appendChild(prev);
  host.appendChild(c5);

  /* 6. 데이터 */
  const c6 = el('div','set-card');
  c6.appendChild(el('h3',null,'데이터'));
  c6.appendChild(el('div','h-desc','설정과 표현을 파일 없이 글자로 내보내고 가져옵니다. 이 시연판의 자료는 이 기기에만 저장됩니다.'));
  const ta = el('textarea'); ta.placeholder = '〈내보내기〉를 누르면 여기에 설정 내용이 나타납니다. 가져올 때는 여기에 붙여 넣고 〈가져오기〉를 누르세요.';
  c6.appendChild(ta);
  const r6 = el('div','set-row'); r6.style.marginTop = '10px';
  const exB = el('button','mini','📤 내보내기');
  exB.addEventListener('click', ()=>{ ta.value = JSON.stringify(state, null, 1); ta.select(); toast('아래 내용을 복사해 보관하세요'); });
  const imB = el('button','mini','📥 가져오기');
  imB.addEventListener('click', ()=>{
    try{
      const v = JSON.parse(ta.value);
      if(!v || !Array.isArray(v.profiles) || !v.profiles.length) throw 0;
      state = v;
      if(!state.profiles.find(p=>p.id===state.cur)) state.cur = state.profiles[0].id;
      save(); applySettings(); renderSettings(); toast('설정을 가져왔습니다');
    }catch(e){ toast('가져올 수 없는 내용입니다'); }
  });
  const rsB = el('button','mini danger','🗑️ 모든 개인설정 삭제');
  rsB.addEventListener('click', ()=>{
    openModal('저장된 모든 프로필·표현·설정을 지우고 처음 상태로 되돌릴까요?', ()=>{
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      state = {profiles:defaultProfiles(), cur:'c'};
      words = []; lastSpoken = '';
      save(); applySettings(); renderSpoken(); renderSettings();
      toast('처음 상태로 되돌렸습니다');
    }, {title:'모든 개인설정 삭제', ok:'네, 모두 삭제할게요', warn:true});
  });
  r6.append(exB, imB, rsB);
  c6.appendChild(r6);
  host.appendChild(c6);

  scanRefresh();
}

/* =========================================================
   시작
   ========================================================= */
applySettings();
go('quick');
</script>
</html>
